name: Tests de l'application
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_ci_tests.py
      - name: Vérifier le module WordPress
        if: runner.os == 'Linux'
        run: |
          php -l wordpress/zpsi-media/zpsi-media.php
          php tests/php/test_media_rename.php
